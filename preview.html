  <script>
(() => {
  const key = 'docofcard-theme';
  const allowed = ['auto', 'light', 'dark'];
  const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  let choice = 'auto';
  try {
    const saved = window.localStorage.getItem(key);
    if (allowed.includes(saved)) choice = saved;
  } catch (_) { /* Storage can be disabled in private browsing. */ }

  function apply() {
    const resolved = choice === 'auto' ? (media && media.matches ? 'dark' : 'light') : choice;
    const root = document.documentElement;
    root.dataset.theme = resolved;
    root.dataset.themeChoice = choice;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', resolved === 'dark' ? '#101116' : '#faf8f4');
    document.querySelectorAll('[data-theme-option]').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.themeOption === choice));
    });
  }

  function initialize() {
    document.querySelectorAll('[data-theme-option]').forEach((button) => {
      button.addEventListener('click', () => {
        choice = button.dataset.themeOption;
        try { window.localStorage.setItem(key, choice); } catch (_) { /* Keep in current tab. */ }
        apply();
      });
    });
    apply();
  }

  apply(); // Before CSS paints: no flash of the wrong theme.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize, { once: true });
  } else { initialize(); }
  if (media) {
    if (media.addEventListener) media.addEventListener('change', () => { if (choice === 'auto') apply(); });
    else if (media.addListener) media.addListener(() => { if (choice === 'auto') apply(); });
  }
  window.addEventListener('storage', (event) => {
    if (event.key === key) {
      choice = allowed.includes(event.newValue) ? event.newValue : 'auto';
      apply();
    }
  });
})();
  </script>

*, *::before, *::after { box-sizing: border-box; }
html { min-width: 280px; scroll-behavior: smooth; }
body {

}
a { color: inherit; }
.page {

  position: relative;
  z-index: 1;
  min-height: 100svh;
  margin: 0 auto;

}
.header, .brand, .header-aside, .eyebrow, .section-top, .footer { display: flex; align-items: center; }
.header { justify-content: space-between; gap: 18px; }
.brand { gap: 12px; text-decoration: none; font-size: 17px; font-weight: 760; letter-spacing: -.055em; white-space: nowrap; }

}
.brand-symbol svg { width: 21px; height: 21px; color: #89f2d8; }

}
.hero, .links { min-width: 0; }
.hero { padding: 0 0 18px; }
.eyebrow { gap: 9px; color: #8fe9d2; font-size: 11px; font-weight: 650; letter-spacing: .16em; }
.eyebrow::before { content: ""; width: 22px; height: 1px; background: currentColor; opacity: .75; }
h1 {
  margin: 23px 0 24px;

}
h1 .highlight { display: block; background: linear-gradient(92deg, #84f0d7 2%, #8dc3f2 65%, #b6b5ff); background-clip: text; -webkit-background-clip: text; color: transparent; }
.hero-desc { margin: 0; max-width: 420px; color: #a6b4c5; font-size: 15px; line-height: 2.05; letter-spacing: .005em; }
.hero-note { display: flex; align-items: center; gap: 14px; margin-top: 42px; color: #75869a; font-size: 12px; }
.hero-note::before { content: ""; width: 32px; height: 1px; background: rgba(153,195,212,.55); }
.section-top { justify-content: space-between; gap: 12px; margin-bottom: 17px; }
.section-title { margin: 0; font-weight: 580; letter-spacing: .01em; font-size: 14px; color: #d9e1ee; }

.card {
  --accent: #83dfd4;
  --glow: rgba(76, 221, 190, .12);
  position: relative;
  isolation: isolate;
  min-width: 0;
  min-height: 222px;
  padding: 23px;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: auto 1fr;
  gap: 22px 10px;
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 23px;
  background: linear-gradient(153deg, rgba(26, 37, 53, .93), rgba(14, 23, 36, .96));
  box-shadow: inset 0 1px rgba(255,255,255,.025), 0 15px 43px rgba(1,6,14,.11);
  transition: transform .24s ease, border-color .24s ease, background .24s ease, box-shadow .24s ease;
}
.card::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: 190px;
  height: 190px;
  top: -110px;
  left: -90px;
  pointer-events: none;
  background: radial-gradient(circle, var(--glow), transparent 70%);
}
.card--group { --accent: #7ecffb; --glow: rgba(78,169,250,.24); }
.card--channel { --accent: #8dedcf; --glow: rgba(67,213,165,.2); }
.card--forum { --accent: #a6a5ff; --glow: rgba(136,119,247,.22); }
.card--micro { --accent: #f3c78c; --glow: rgba(238,174,100,.18); }
.card-icon {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  grid-column: 1;
  grid-row: 1;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 11%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 19%, transparent);
  border-radius: 16px;
}
.card-icon svg { width: 25px; height: 25px; }
.card-arrow {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  grid-column: 2;
  grid-row: 1;
  border: 1px solid rgba(204,224,248,.12);
  border-radius: 50%;
  color: #a8b5c7;
  transition: transform .24s ease, color .24s ease, background .24s ease;
}
.card-arrow svg { width: 16px; height: 16px; }
.card-copy { grid-column: 1 / -1; grid-row: 2; align-self: end; min-width: 0; }
.card-tag { display: block; margin-bottom: 8px; color: var(--accent); font-size: 10px; font-weight: 690; letter-spacing: .16em; }
.card-title { display: block; color: #f3f7fd; font-size: 19px; font-weight: 695; line-height: 1.3; letter-spacing: -.035em; }
.card-desc { display: block; margin-top: 7px; color: #8ea1b5; font-size: 12px; line-height: 1.6; }
.card.is-disabled { cursor: not-allowed; opacity: .69; }
.card.is-disabled .card-arrow { color: #8391a5; }
.card:focus-visible { outline: 2px solid #8ef1db; outline-offset: 4px; }
@media (hover: hover) and (pointer: fine) {
  a.card:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: linear-gradient(145deg, rgba(35, 49, 64, .95), rgba(17, 29, 44, .98)); box-shadow: 0 20px 45px rgba(0,0,0,.24); }
  a.card:hover .card-arrow { color: #07141f; background: var(--accent); transform: translate(2px,-2px); }
}
.footer { justify-content: space-between; gap: 12px 24px; border-top: 1px solid var(--soft-line); padding-top: 19px; color: #72869b; font-size: 11px; letter-spacing: .015em; }
.footer-right { color: #6d8094; }
@media (max-width: 980px) {
  .page { max-width: 850px; }
  .main { grid-template-columns: 1fr; gap: 42px; padding: 76px 0 52px; }

  h1, .hero h1 { font-size: clamp(42px, 11.8vw, 62px); margin: 19px 0 16px; letter-spacing: -.07em; }
  .hero-desc { font-size: 13.5px; line-height: 1.9; }

  .card {
    min-height: 110px;

  }

}
@media (max-width: 340px) {
  .page { padding-left: 15px; padding-right: 15px; }
  .header-aside span:last-child { display: none; }
  .card { padding-inline: 14px; gap: 11px; }
  .card-title { font-size: 16px; }
}
/* 支持 Viewport Segments API 的双屏/折叠设备：主内容不会落在中间铰链上。 */
@media (horizontal-viewport-segments: 2) {
  .page {
    width: 100%;
    max-width: none;
    padding: 25px 0 21px;
    display: grid;
    grid-template-columns: env(viewport-segment-width 0 0) env(viewport-segment-width 1 0);
    column-gap: calc(env(viewport-segment-left 1 0) - env(viewport-segment-right 0 0));
    grid-template-rows: auto 1fr auto;
  }
  .header { grid-column: 1; grid-row: 1; padding: 0 clamp(17px, 3.5vw, 42px); }
  .header-aside { display: none; }
  .main { display: contents; }
  .hero { grid-column: 1; grid-row: 2; align-self: center; padding: 32px clamp(17px, 3.5vw, 42px); }
  h1, .hero h1 { font-size: clamp(35px, 4.25vw, 68px); }
  .hero-desc { font-size: clamp(12px, 1.2vw, 15px); }
  .links { grid-column: 2; grid-row: 2; align-self: center; padding: 25px clamp(17px, 3vw, 36px); }
  .cards { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .card { min-height: 177px; padding: 16px; border-radius: 19px; }
  .card-title { font-size: clamp(14px, 1.5vw, 19px); }
  .card-desc { font-size: 11px; }
  .card-icon { width: 43px; height: 43px; border-radius: 13px; }
  .card-icon svg { width: 22px; height: 22px; }
  .footer { grid-column: 1; grid-row: 3; margin: 0 clamp(17px, 3.5vw, 42px); }
}
@media (horizontal-viewport-segments: 2) and (max-width: 940px) {
  .cards { grid-template-columns: 1fr; }
  .card {
    min-height: 91px;
    display: grid;
    grid-template-columns: 42px minmax(0,1fr) 29px;
    grid-template-rows: auto;
    align-items: center;
    gap: 11px;
    padding: 12px;
  }
  .card-icon { width: 41px; height: 41px; grid-column: 1; grid-row: 1; }
  .card-copy { grid-column: 2; grid-row: 1; align-self: center; }
  .card-arrow { width: 29px; height: 29px; grid-column: 3; grid-row: 1; }
  .card-tag { margin-bottom: 4px; }
  .card-desc { margin-top: 3px; }
  .hero-note { display: none; }
  .footer-right { display: none; }
}
@media (vertical-viewport-segments: 2) {
  .page {
    width: 100%;
    max-width: none;
    min-height: 100svh;
    padding: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: env(viewport-segment-height 0 0) env(viewport-segment-height 0 1);
    row-gap: calc(env(viewport-segment-top 0 1) - env(viewport-segment-bottom 0 0));
  }
  .header { grid-column: 1; grid-row: 1; z-index: 1; align-self: start; margin: 18px clamp(20px, 5vw, 70px); }
  .main { display: contents; }
  .hero { grid-column: 1; grid-row: 1; align-self: center; padding: 68px clamp(20px, 5vw, 70px) 18px; }
  h1, .hero h1 { font-size: clamp(37px, 6.5vw, 58px); margin-block: 13px; }
  .hero-note { display: none; }
  .links { grid-column: 1; grid-row: 2; align-self: center; padding: 17px clamp(20px, 5vw, 70px); }
  .cards { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
  .card { min-height: 160px; padding: 15px; gap: 14px; border-radius: 17px; }
  .card-icon { width: 41px; height: 41px; border-radius: 12px; }
  .card-icon svg { width: 22px; height: 22px; }
  .card-title { font-size: 15px; }
  .card-desc { font-size: 10px; }
  .footer { display: none; }
}
@media (vertical-viewport-segments: 2) and (max-width: 720px) {
  .cards { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .card { min-height: 112px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

  --muted: #aba8aa;

  --soft-line: rgba(243,237,233,.13);
}
html[data-theme="dark"] body { background: #101116; color: var(--text); }
html[data-theme="dark"] body::before {

}
html[data-theme="dark"] body::after {
  opacity: .3;

}

  }
  html[data-theme="dark"] a.card:hover .card-arrow { color: #14141a; background: var(--accent); }

/* Theme choice: visible three-way control, icon-only at small widths. */
.theme-control {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  gap: 3px;
  padding: 4px;
  border: 1px solid #e7e0db;
  border-radius: 14px;
  background: rgba(255,255,255,.74);
  box-shadow: 0 3px 12px rgba(79,59,47,.035);

.theme-option {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;

  padding: 0 11px;

  font: inherit;
  font-size: 12px;
  font-weight: 580;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s ease, color .15s ease, box-shadow .15s ease;
}
.theme-option svg { width: 15px; height: 15px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

@media (hover: hover) and (pointer: fine) {

}
@media (max-width: 600px) {

@media (prefers-reduced-motion: reduce) {

}
